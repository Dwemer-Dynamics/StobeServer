name: PR Tests

on:
  pull_request:
  workflow_dispatch:
    inputs:
      test_file:
        description: "Optional single test path, for example tests/rechat_flow_regression.php. Leave blank to run all tests."
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  regressions:
    name: PHP Regression Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: pgvector/pgvector:pg18-trixie
        env:
          POSTGRES_DB: stobe_test
          POSTGRES_USER: dwemer
          POSTGRES_PASSWORD: dwemer
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dwemer -d stobe_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: pgsql
          coverage: none

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Verify database service
        env:
          PGPASSWORD: dwemer
          STOBE_DB_NAME: stobe_test
          STOBE_DB_USER: dwemer
          STOBE_DB_PASSWORD: dwemer
        run: |
          psql -h localhost -U dwemer -d stobe_test -v ON_ERROR_STOP=1 -c "SELECT version();"
          psql -h localhost -U dwemer -d stobe_test -v ON_ERROR_STOP=1 -c "CREATE EXTENSION IF NOT EXISTS vector;"

      - name: Run regression tests
        env:
          PGPASSWORD: dwemer
          STOBE_DB_NAME: stobe_test
          STOBE_DB_USER: dwemer
          STOBE_DB_PASSWORD: dwemer
          REQUESTED_TEST: ${{ github.event.inputs.test_file || '' }}
        shell: bash
        run: |
          set -euo pipefail

          all_tests=(
            "tests/bio_unique_regression.php"
            "tests/chat_flow_regression.php"
            "tests/chat_json_endpoint_regression.php"
            "tests/chat_processor_regression.php"
            "tests/conversation_context_regression.php"
            "tests/diary_gamets_conversion.php"
            "tests/ingress_people_regression.php"
            "tests/import_rules_regression.php"
            "tests/main_ingress_http_regression.php"
            "tests/npc_history_snapshot_regression.php"
            "tests/playthrough_rollback_regression.php"
            "tests/playthrough_storage_regression.php"
            "tests/rechat_flow_regression.php"
            "tests/rechat_selection_regression.php"
            "tests/relationship_system_regression.php"
            "tests/rename_snapshot_regression.php"
            "tests/startup_runtime_regression.php"
            "tests/structured_dialogue_contract_regression.php"
          )
          tests=("${all_tests[@]}")

          if [[ -n "${REQUESTED_TEST}" ]]; then
            if [[ "${REQUESTED_TEST}" != tests/*.php || "${REQUESTED_TEST}" == *".."* || ! -f "${REQUESTED_TEST}" ]]; then
              echo "Invalid test_file input: ${REQUESTED_TEST}" >&2
              echo "Use a repository test path like tests/rechat_flow_regression.php." >&2
              exit 1
            fi
            tests=("${REQUESTED_TEST}")
          fi

          reset_db() {
            if [[ "${STOBE_DB_NAME}" != *test* && "${STOBE_DB_NAME}" != *ci* ]]; then
              echo "Refusing to reset non-test database: ${STOBE_DB_NAME}" >&2
              exit 1
            fi
            psql -h localhost -U dwemer -d "${STOBE_DB_NAME}" -v ON_ERROR_STOP=1 -c "DROP SCHEMA public CASCADE; CREATE SCHEMA public;"
            psql -h localhost -U dwemer -d "${STOBE_DB_NAME}" -v ON_ERROR_STOP=1 -f data/schema.sql
            php debug/run_db_updates.php
          }

          for test_file in "${tests[@]}"; do
            echo "::group::${test_file}"
            reset_db
            php "${test_file}"
            echo "::endgroup::"
          done
